<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Math Box</title>
  <link rel="stylesheet" href="../shared/page.css">
  <script src="../shared/kit.js"></script>
  <style>
    :root {
      --top: max(18vh, calc(var(--nav-btn) * 0.72 + 5vmin));
      --in: #2a8fff;   /* color for the box and the first number */
      --out: #ff9f1c;  /* color for outside and the second number */
    }
    body { background: radial-gradient(circle at 50% 30%, #fffdf3, #ffeeb8); }

    /* ---------- equation ---------- */
    #problem {
      position: absolute; left: var(--nav-safe); right: var(--nav-safe); top: 0; height: var(--top);
      display: flex; align-items: center; justify-content: center; gap: .3em;
      font-weight: 800; font-size: min(12vmin, 10vw); line-height: 1; white-space: nowrap;
      color: var(--ink);
    }
    #problem .a { color: var(--in); }
    #problem .b { color: var(--out); }
    #problem .ans { color: #c3cbd9; min-width: .7em; text-align: center; }
    #problem .ans.solved { color: var(--green); animation: pop 600ms cubic-bezier(.3,1.8,.5,1); }
    @keyframes pop { 0% { transform: scale(.3); } 50% { transform: scale(1.4) rotate(-8deg); } 100% { transform: scale(1); } }

    /* ---------- the box and the outside area ---------- */
    .area { position: absolute; top: calc(var(--top) + 2vmin); bottom: var(--nav-safe); }
    #box {
      left: 3vmin; right: calc(50% + 1.5vmin);
      background: #e3f0ff; /* fallback for older browsers without color-mix */
      background: color-mix(in srgb, var(--in) 14%, #fff);
      border: max(5px, 1.1vmin) solid var(--in);
      border-radius: 4vmin;
      box-shadow: inset 0 1vmin 0 rgba(255,255,255,.7), 0 1vmin 0 #1a5799;
    }
    #box.glow { animation: glow 900ms ease-out; }
    @keyframes glow { 30% { box-shadow: 0 0 0 2vmin rgba(61,220,132,.6); } }
    #outside {
      left: calc(50% + 1.5vmin); right: 3vmin;
      border: max(4px, .7vmin) dashed rgba(255,159,28,.55);
      border-radius: 4vmin;
    }
    .count {
      position: absolute; top: 0; left: 50%;
      transform: translate(-50%, -55%);
      min-width: 1.4em; padding: .05em .3em 0;
      border-radius: 999px;
      font-weight: 800; font-size: min(9vmin, 8vw); line-height: 1.1; text-align: center;
      color: #fff; border: max(3px, .6vmin) solid #fff;
      box-shadow: 0 .6vmin 0 rgba(0,0,0,.15);
      z-index: 3;
    }
    #box .count { background: var(--in); }
    .count.bump { animation: bump 300ms ease; }
    @keyframes bump { 50% { transform: translate(-50%, -55%) scale(1.3); } }

    /* ---------- items ---------- */
    .item {
      position: absolute; left: 0; top: 0;
      display: grid; place-items: center;
      line-height: 1;
      cursor: grab;
      transition: transform 280ms cubic-bezier(.3,1.3,.5,1);
      z-index: 5;
      filter: drop-shadow(0 .5vmin .3vmin rgba(0,0,0,.18));
    }
    .item.dragging { transition: none; z-index: 20; cursor: grabbing; filter: drop-shadow(0 1.6vmin 1vmin rgba(0,0,0,.25)); }
    .item > span { display: block; transition: transform 150ms; }
    .item.dragging > span { transform: scale(1.25); }
    .item.cheer > span { animation: cheer 700ms cubic-bezier(.3,1.6,.5,1); }
    @keyframes cheer { 40% { transform: translateY(-30%) scale(1.25) rotate(-10deg); } }
  </style>
</head>
<body>
  <div id="problem" aria-live="polite">
    <span class="a" id="a"></span><span id="op"></span><span class="b" id="b"></span><span>=</span><span class="ans" id="ans">?</span>
  </div>
  <div class="area" id="box"><div class="count" id="inCount">0</div></div>
  <div class="area" id="outside"></div>

  <script>
    const THINGS = ["🍎", "🍓", "🐟", "⭐", "🍪", "🐞", "🦆", "🍌", "🧸", "🎈", "🐣", "🍩", "🚗", "🌸", "🐸", "🧁"];
    const COLS = 4, ROWS = 3, SLOTS = COLS * ROWS; // up to 12 things in each area

    const $ = (id) => document.getElementById(id);
    const box = $("box"), outside = $("outside");
    let items = [], target = 0, solved = false;

    // ---------- problems ----------
    const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
    function newProblem() {
      items.forEach((it) => it.el.remove());
      items = [];
      solved = false;
      $("ans").textContent = "?";
      $("ans").classList.remove("solved");

      const add = Math.random() < 0.5;
      let a, b;
      if (add) { a = rand(1, 9); b = rand(1, Math.min(5, SLOTS - a)); }   // sums up to 12
      else     { a = rand(1, 10); b = rand(1, Math.min(5, a)); }          // answers can be 0
      target = add ? a + b : a - b;
      $("a").textContent = a;
      $("op").textContent = add ? "+" : "−";
      $("b").textContent = b;

      const thing = THINGS[Math.floor(Math.random() * THINGS.length)];
      for (let i = 0; i < a; i++) makeItem(thing, "in", i);
      if (add) for (let i = 0; i < b; i++) makeItem(thing, "out", i);
      layout(true);
    }

    function makeItem(thing, where, slot) {
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = `<span>${thing}</span>`;
      document.body.appendChild(el);
      const it = { el, where, slot, drag: null };
      items.push(it);
      grab(it);
    }

    // ---------- slots & layout ----------
    function slotGeometry(area) {
      const r = area.getBoundingClientRect();
      const pad = Math.min(r.width, r.height) * 0.06;
      const cw = (r.width - pad * 2) / COLS, ch = (r.height - pad * 2) / ROWS;
      return { r, pad, cw, ch, size: Math.min(cw, ch) * 0.86 };
    }
    function slotXY(where, slot) {
      const g = slotGeometry(where === "in" ? box : outside);
      const col = slot % COLS, row = Math.floor(slot / COLS);
      return {
        x: g.r.left + g.pad + g.cw * (col + 0.5),
        y: g.r.top + g.pad + g.ch * (row + 0.5) + g.ch * 0.08, // nudge down, clear of the count badge
        size: g.size,
      };
    }
    function place(it, x, y, size) {
      it.el.style.width = it.el.style.height = size + "px";
      it.el.style.fontSize = size * 0.82 + "px";
      it.el.style.transform = `translate(${x - size / 2}px, ${y - size / 2}px)`;
    }
    function layout(instant) {
      for (const it of items) {
        if (it.drag) continue;
        if (instant) it.el.style.transition = "none";
        const p = slotXY(it.where, it.slot);
        place(it, p.x, p.y, p.size);
        if (instant) { void it.el.offsetWidth; it.el.style.transition = ""; }
      }
      const nIn = items.filter((i) => i.where === "in").length;
      setCount($("inCount"), nIn);
    }
    function setCount(el, n) {
      if (el.textContent === String(n)) return;
      el.textContent = n;
      el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
    }
    addEventListener("resize", () => layout(true));

    function freeSlot(where, nearX, nearY) {
      const used = new Set(items.filter((i) => i.where === where && !i.drag).map((i) => i.slot));
      let best = -1, bestD = Infinity;
      for (let s = 0; s < SLOTS; s++) {
        if (used.has(s)) continue;
        const p = slotXY(where, s);
        const d = nearX == null ? s : (p.x - nearX) ** 2 + (p.y - nearY) ** 2;
        if (d < bestD) { bestD = d; best = s; }
      }
      return best;
    }

    // ---------- dragging (several fingers at once is fine) ----------
    function grab(it) {
      const el = it.el;
      el.addEventListener("pointerdown", (e) => {
        if (solved || it.drag) return;
        e.preventDefault();
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
        const p = slotXY(it.where, it.slot);
        it.drag = { id: e.pointerId, dx: e.clientX - p.x, dy: e.clientY - p.y, sx: e.clientX, sy: e.clientY, moved: false, size: p.size };
        el.classList.add("dragging");
        Kit.tone(660, 0.07, { type: "sine", volume: 0.12 });
      });
      el.addEventListener("pointermove", (e) => {
        const d = it.drag;
        if (!d || e.pointerId !== d.id) return;
        if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 10) d.moved = true;
        place(it, e.clientX - d.dx, e.clientY - d.dy, d.size);
      });
      const drop = (e) => {
        const d = it.drag;
        if (!d || e.pointerId !== d.id) return;
        it.drag = null;
        el.classList.remove("dragging");
        const from = it.where;
        let to;
        if (!d.moved) to = from === "in" ? "out" : "in"; // a simple tap sends it across
        else {
          const r = box.getBoundingClientRect();
          const cx = e.clientX - d.dx, cy = e.clientY - d.dy;
          to = cx > r.left && cx < r.right && cy > r.top && cy < r.bottom ? "in" : "out";
        }
        const slot = d.moved ? freeSlot(to, e.clientX - d.dx, e.clientY - d.dy) : freeSlot(to);
        if (slot >= 0) { it.where = to; it.slot = slot; }
        layout();
        if (it.where !== from) moved(it.where);
      };
      el.addEventListener("pointerup", drop);
      el.addEventListener("pointercancel", drop);
    }

    function moved(to) {
      const nIn = items.filter((i) => i.where === "in").length;
      // A little musical step: higher as the box fills up
      Kit.tone(300 * Math.pow(2, nIn / 12), 0.16, { type: "triangle", volume: 0.22 });
      // Count out loud how many are in the box now (a new count cuts off the previous one).
      // TODO voice actor: record the numbers 0–12 as 7/audio/numbers/0.mp3 … 12.mp3
      Kit.say(String(nIn), { audio: "audio/numbers/" + nIn + ".mp3", rate: 1 });
      if (nIn === target && !solved) win();
    }

    async function win() {
      solved = true;
      $("ans").textContent = target;
      $("ans").classList.add("solved");
      box.classList.remove("glow"); void box.offsetWidth; box.classList.add("glow");
      [523, 659, 784, 1047].forEach((f, i) => Kit.tone(f, 0.25, { type: "triangle", volume: 0.2, delay: 0.15 + i * 0.11 }));
      items.filter((i) => i.where === "in").forEach((it, k) => setTimeout(() => it.el.classList.add("cheer"), k * 70));

      const { confetti } = await Kit.use("confetti");
      const r = box.getBoundingClientRect();
      confetti({
        particleCount: 140, spread: 90, startVelocity: 45,
        origin: { x: (r.left + r.width / 2) / innerWidth, y: (r.top + r.height / 2) / innerHeight },
        disableForReducedMotion: true,
      });
      setTimeout(newProblem, 3500);
    }

    newProblem();
  </script>
</body>
</html>
