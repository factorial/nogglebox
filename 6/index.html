<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Piano</title>
  <link rel="stylesheet" href="../shared/page.css">
  <script src="../shared/kit.js"></script>
  <style>
    :root { --top: max(20vh, calc(var(--nav-btn) * 0.72 + 5vmin)); }
    body {
      background:
        linear-gradient(rgba(255,255,255,.06), rgba(0,0,0,.15)),
        repeating-linear-gradient(90deg, #8a4b2a 0 3px, #93512e 3px 9px, #864826 9px 14px);
    }

    /* Notes being played, big, at the top */
    #display {
      position: absolute; left: var(--nav-safe); right: var(--nav-safe); top: 0;
      height: var(--top);
      display: flex; align-items: center; justify-content: center; gap: .35em;
      font-weight: 800; font-size: min(13vmin, 11vw); line-height: 1;
      pointer-events: none;
    }
    #display span {
      -webkit-text-stroke: .05em #fff; paint-order: stroke fill;
      text-shadow: 0 .06em 0 rgba(0,0,0,.25);
      animation: pop 260ms cubic-bezier(.3,1.8,.5,1);
      transition: opacity 600ms;
    }
    #display span.gone { opacity: 0; }
    @keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }

    /* Keyboard */
    #keys {
      position: absolute;
      left: 2vmin; right: 2vmin;
      top: var(--top); bottom: var(--nav-safe);
      border-top: 1.4vmin solid #b0283b; /* felt strip */
      box-shadow: 0 -.5vmin 1.5vmin rgba(0,0,0,.35);
    }
    .key { position: absolute; top: 0; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; }
    .white {
      height: 100%;
      background: linear-gradient(#f3f3f3, #ffffff 70%, #e9e9e9);
      border: .25vmin solid #9a9a9a; border-top: 0;
      border-radius: 0 0 1.2vmin 1.2vmin;
      box-shadow: inset 0 -1vmin 0 rgba(0,0,0,.08);
      z-index: 1;
    }
    .black {
      height: 60%;
      background: linear-gradient(#3a3a3a, #111 85%);
      border-radius: 0 0 .9vmin .9vmin;
      box-shadow: 0 .6vmin .8vmin rgba(0,0,0,.45), inset 0 -.8vmin 0 rgba(255,255,255,.08);
      z-index: 2;
    }
    .key.down { background: var(--c); box-shadow: inset 0 1vmin 1.5vmin rgba(0,0,0,.2); }
    .white.down { transform-origin: top; transform: scaleY(.985); }

    .label {
      font-weight: 800; line-height: 1;
      color: #fff;
      -webkit-text-stroke: .06em rgba(0,0,0,.25); paint-order: stroke fill;
      opacity: 0; transform: scale(.4) translateY(30%);
      transition: opacity 120ms, transform 200ms cubic-bezier(.3,1.8,.5,1);
      pointer-events: none;
    }
    .white .label { font-size: min(7vmin, var(--w) * 0.6); margin-bottom: 2.4vmin; }
    .black .label { font-size: min(4vmin, var(--w) * 0.45); margin-bottom: 1.6vmin; }
    .key.down .label { opacity: 1; transform: scale(1) translateY(0); }

    /* Little stars, balloons and such floating up from a played key */
    .float {
      position: absolute; pointer-events: none;
      font-size: min(6vmin, 7vw); line-height: 1;
      animation: float-up 1.3s ease-out forwards;
      z-index: 5;
    }
    @keyframes float-up {
      from { opacity: 1; transform: translate(-50%, 0) scale(.6); }
      to   { opacity: 0; transform: translate(calc(-50% + var(--dx)), -18vh) scale(1.3) rotate(var(--rot)); }
    }
  </style>
</head>
<body>
  <div id="display" aria-live="polite"></div>
  <div id="keys"></div>

  <script>
    const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    // One rainbow color per note, so each note always looks the same.
    const COLORS = ["#ff4d4d", "#ff7a3d", "#ff9f1c", "#ffc300", "#f5d000", "#3ddc84", "#1fc7a8",
                    "#2ec4ff", "#2a8fff", "#5b6cff", "#9b5de5", "#f15bb5"];
    const WHITE_STEPS = [0, 2, 4, 5, 7, 9, 11];      // C D E F G A B within an octave
    const HAS_BLACK_AFTER = new Set([0, 2, 5, 7, 9]); // C# D# F# G# A#

    const keysEl = document.getElementById("keys");
    const display = document.getElementById("display");
    let keys = [];   // { midi, el }

    // ---------- build the keyboard to fit the screen ----------
    function build() {
      const W = keysEl.clientWidth;
      const vmin = Math.min(innerWidth, innerHeight) / 100;
      const whites = Math.max(8, Math.min(22, Math.floor(W / Math.max(52, vmin * 7.2))));
      const startOctave = whites > 15 ? 3 : 4; // big screens start lower so middle C sits mid-keyboard
      const ww = W / whites, bw = ww * 0.62;

      keysEl.replaceChildren();
      keys = [];
      for (let i = 0; i < whites; i++) {
        const oct = startOctave + Math.floor(i / 7), step = WHITE_STEPS[i % 7];
        const midi = 12 * (oct + 1) + step;
        addKey(midi, "white", i * ww, ww);
        if (HAS_BLACK_AFTER.has(step) && i < whites - 1) addKey(midi + 1, "black", (i + 1) * ww - bw / 2, bw);
      }
    }
    function addKey(midi, kind, left, width) {
      const pc = midi % 12;
      const el = document.createElement("div");
      el.className = "key " + kind;
      el.style.left = left + "px";
      el.style.width = width + "px";
      el.style.setProperty("--c", COLORS[pc]);
      el.style.setProperty("--w", width + "px");
      el.innerHTML = `<span class="label">${NAMES[pc]}</span>`;
      el.dataset.i = keys.length;
      keysEl.appendChild(el);
      keys.push({ midi, el, holds: 0, voice: null });
    }
    addEventListener("resize", () => { releaseAll(); build(); });

    // ---------- sound: a soft synthesized piano ----------
    let master = null, wave = null, noiseBuf = null;
    function engine() {
      const ac = Kit.audio();
      if (!ac) return null;
      if (!master) {
        const comp = ac.createDynamicsCompressor(); // keeps big chords from distorting
        comp.threshold.value = -14; comp.ratio.value = 6;
        master = ac.createGain();
        master.gain.value = 0.7;
        master.connect(comp).connect(ac.destination);
        // Piano-ish tone: strong fundamental, fading upper harmonics
        const amps = [0, 1, 0.5, 0.28, 0.2, 0.11, 0.07, 0.04, 0.025, 0.015];
        wave = ac.createPeriodicWave(new Float32Array(amps.length), new Float32Array(amps));
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.05, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      }
      return ac;
    }

    function noteOn(midi) {
      const ac = engine();
      if (!ac) return null;
      const t = ac.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);
      const decay = 2.6 - (midi - 48) * 0.035; // low notes ring longer

      const out = ac.createGain();
      out.gain.setValueAtTime(0, t);
      out.gain.linearRampToValueAtTime(0.32, t + 0.006);
      out.gain.setTargetAtTime(0, t + 0.01, Math.max(0.5, decay) / 3);

      const lp = ac.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(Math.min(16000, f * 9), t);
      lp.frequency.setTargetAtTime(Math.min(8000, f * 2.5), t + 0.01, 0.25);

      const oscs = [-4, 4].map((cents) => {
        const o = ac.createOscillator();
        o.setPeriodicWave(wave);
        o.frequency.value = f;
        o.detune.value = cents; // two slightly detuned strings
        o.connect(lp);
        o.start(t);
        return o;
      });
      lp.connect(out).connect(master);

      // hammer "tock"
      const n = ac.createBufferSource();
      n.buffer = noiseBuf;
      const bp = ac.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = Math.min(6000, f * 4); bp.Q.value = 1.5;
      const ng = ac.createGain(); ng.gain.value = 0.06;
      n.connect(bp).connect(ng).connect(master);
      n.start(t);

      return { out, oscs };
    }

    function noteOff(voice) {
      if (!voice) return;
      const ac = Kit.audio(), t = ac.currentTime;
      voice.out.gain.cancelScheduledValues(t);
      voice.out.gain.setValueAtTime(voice.out.gain.value, t);
      voice.out.gain.setTargetAtTime(0, t, 0.09); // damper: quick but not clicky
      voice.oscs.forEach((o) => o.stop(t + 0.6));
    }

    // ---------- pressing keys (any number of fingers at once) ----------
    const fingers = new Map(); // pointerId → key

    function press(k) {
      k.holds++;
      if (k.holds > 1) return; // another finger already holds it
      noteOff(k.voice);
      k.voice = noteOn(k.midi);
      k.el.classList.add("down");
      floatLabel(k);
      showHeld();
    }
    function release(k) {
      if (!k || k.holds === 0) return;
      k.holds--;
      if (k.holds > 0) return;
      noteOff(k.voice);
      k.voice = null;
      k.el.classList.remove("down");
      showHeld();
    }
    function releaseAll() {
      fingers.clear();
      keys.forEach((k) => { k.holds = 1; release(k); });
    }

    function keyAt(x, y) {
      const el = document.elementFromPoint(x, y);
      const keyEl = el && el.closest(".key");
      return keyEl ? keys[keyEl.dataset.i] : null;
    }

    keysEl.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const k = keyAt(e.clientX, e.clientY);
      fingers.set(e.pointerId, k);
      if (k) press(k);
    });
    // Sliding a finger along the keys plays each key it reaches (glissando).
    keysEl.addEventListener("pointermove", (e) => {
      if (!fingers.has(e.pointerId)) return;
      const k = keyAt(e.clientX, e.clientY), prev = fingers.get(e.pointerId);
      if (k === prev) return;
      release(prev);
      fingers.set(e.pointerId, k);
      if (k) press(k);
    });
    function lift(e) {
      if (!fingers.has(e.pointerId)) return;
      release(fingers.get(e.pointerId));
      fingers.delete(e.pointerId);
    }
    ["pointerup", "pointercancel", "lostpointercapture"].forEach((t) => keysEl.addEventListener(t, lift));
    window.addEventListener("pointerup", lift);
    window.addEventListener("blur", releaseAll);

    // ---------- showing note names ----------
    function showHeld() {
      const held = keys.filter((k) => k.holds > 0).sort((a, b) => a.midi - b.midi);
      if (!held.length) {
        display.querySelectorAll("span").forEach((s) => s.classList.add("gone"));
        return;
      }
      display.replaceChildren(...held.map((k) => {
        const s = document.createElement("span");
        s.textContent = NAMES[k.midi % 12];
        s.style.color = COLORS[k.midi % 12];
        return s;
      }));
    }

    // Cheerful things that float up from a played key. (Not music notes: real notes like ♪ and ♫
    // mean particular lengths of sound, so random ones would teach something untrue.)
    const SPARKLES = ["⭐", "🌟", "✨", "💫", "🎈", "💖", "💜", "💙", "🌈", "🦋", "🌸", "🌼", "🌻", "🍭", "🍬", "🎉", "☀️", "🐞", "🫧", "🪁"];

    function floatLabel(k) {
      const r = k.el.getBoundingClientRect();
      const f = document.createElement("div");
      f.className = "float";
      f.textContent = SPARKLES[Math.floor(Math.random() * SPARKLES.length)];
      f.style.left = r.left + r.width / 2 + "px";
      f.style.top = r.top - innerHeight * 0.02 + "px";
      f.style.setProperty("--dx", (Math.random() - 0.5) * 8 + "vmin");
      f.style.setProperty("--rot", (Math.random() - 0.5) * 50 + "deg");
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 1350);
    }

    build();
  </script>
</body>
</html>
