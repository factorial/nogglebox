<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Sound It Out</title>
  <link rel="stylesheet" href="../../shared/page.css">
  <script src="../../shared/kit.js"></script>
  <script src="words.js"></script>                <!-- the word list, shared with split-sounds.sh -->
  <script src="audio/words/index.js"></script>    <!-- which recordings exist, and their timings (made by split-sounds.sh) -->
  <style>
    body { background: linear-gradient(#fff4d6, #ffe1ec); }

    .tile {
      position: absolute; left: 0; top: 0;
      display: grid; place-items: center;
      border-radius: 18%;
      border: max(4px, .9vmin) solid #fff;
      color: #fff;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 1vmin 0 rgba(29,43,83,.18), 0 2vmin 4vmin rgba(29,43,83,.12);
      transition: transform 650ms cubic-bezier(.3,1.25,.5,1);
      will-change: transform;
    }
    .tile.consonant { background: var(--blue); }
    .tile.vowel     { background: var(--red); }
    .tile > span { display: block; transition: transform 160ms ease; padding-top: .08em; }
    .tile.peek > span { animation: wiggle 1.3s ease-in-out infinite; }
    @keyframes wiggle { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-9deg); } 40% { transform: rotate(7deg); } 60% { transform: rotate(0); } }
    .tile.lit > span { transform: scale(1.22) translateY(-6%); }
    .tile.lit { box-shadow: 0 0 0 1.4vmin rgba(255,195,0,.7), 0 1vmin 0 rgba(29,43,83,.18); }

    .picture {
      position: absolute; left: 50%; top: 4%;
      transform: translateX(-50%) scale(0);
      font-size: min(26vmin, 30vw);
      line-height: 1;
      transition: transform 500ms cubic-bezier(.3,1.6,.5,1);
      pointer-events: none;
    }
    .picture.show { transform: translateX(-50%) scale(1); }
    .picture.cheer { animation: cheer 900ms cubic-bezier(.3,1.6,.5,1); }
    @keyframes cheer {
      30% { transform: translateX(-50%) translateY(-8%) scale(1.25) rotate(-10deg); }
      60% { transform: translateX(-50%) scale(.95) rotate(6deg); }
      100% { transform: translateX(-50%) scale(1); }
    }

    #probe { position: absolute; visibility: hidden; height: var(--nav-safe); }
  </style>
</head>
<body>
  <div class="picture" id="picture"></div>
  <div id="probe"></div> <!-- measures the nav buttons' safe area -->

  <script>
    // ---------- words ----------
    // The word list and how words split into sounds live in words.js.
    const { WORDS, sounds, plain, SPOKEN } = window.SOUND_IT_OUT;
    const VOWELS = /[aeiou]/;

    // ---------- the voice ----------
    // Each word has one recording: its sounds said one at a time with short pauses, then the
    // whole word ("b… a… ll… ball!"). split-sounds.sh finds each piece and saves its timing in
    // audio/words/index.js, so a tile plays exactly its own sound from that word. Until a
    // word's recording exists, the built-in voice says the sounds instead.
    // Recordings: one per word ("b… a… ll… b-a-ll… ball!"), processed into audio/words/ by split-sounds.sh.
    const RECORDINGS = window.WORD_AUDIO || {};
    const decoded = {};
    function recording(w) {                   // Promise of the decoded recording, or null
      const rec = RECORDINGS[w], ac = Kit.audio();
      if (!rec || !ac) return Promise.resolve(null);
      if (!decoded[w]) {
        decoded[w] = fetch("audio/words/" + rec.file)
          .then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
          .then((bytes) => new Promise((ok, bad) => ac.decodeAudioData(bytes, ok, bad)))
          .catch((err) => { console.warn("[Sound It Out] couldn't load the recording for " + w, err); return null; });
      }
      return decoded[w];
    }
    let clip = null;
    function stopClip() { if (clip) { try { clip.stop(); } catch (_) {} clip = null; } }
    function playClip(buffer, [start, end]) {
      return new Promise((resolve) => {
        const ac = Kit.audio(), src = ac.createBufferSource();
        src.buffer = buffer;
        src.connect(ac.destination);
        src.onended = () => { if (clip === src) clip = null; resolve(); };
        clip = src;
        src.start(0, start, Math.max(0.01, end - start));
      });
    }

    let speechRun = 0; // bumps whenever a new sequence starts, cancelling the old one

    // Say each tile's sound in turn, lighting the tile up while it plays.
    async function sayTiles(items) {
      const run = ++speechRun;
      Kit.stopVoice(); stopClip();
      document.querySelectorAll(".tile.lit").forEach((t) => t.classList.remove("lit"));
      const buffer = await recording(word);
      for (const it of items) {
        if (run !== speechRun) return false;
        it.el.classList.add("lit");
        if (buffer) await playClip(buffer, RECORDINGS[word].sounds[it.index]);
        else await Kit.say(it.spoken, { rate: 0.8, pitch: 1.15 });
        it.el.classList.remove("lit");
        await new Promise((r) => setTimeout(r, 120));
      }
      return run === speechRun;
    }
    async function sayWord() {
      const run = ++speechRun;
      Kit.stopVoice(); stopClip();
      tiles.forEach((t) => t.el.classList.add("lit"));
      const buffer = await recording(word);
      if (run !== speechRun) return;
      if (buffer) await playClip(buffer, RECORDINGS[word].word);
      else await Kit.say(word + "!", { rate: 0.8, pitch: 1.15 });
      if (run === speechRun) tiles.forEach((t) => t.el.classList.remove("lit"));
    }

    // ---------- layout ----------
    let tiles = [], placed = 0, word = "", complete = false;
    let deck = [], nextTimer = null;

    // The letters sit in the band between the picture (top) and the nav buttons (bottom),
    // sized to fit, so nothing ever overlaps. offsetTop/offsetHeight ignore the picture's
    // pop-in scale animation, so this works even while it's hidden.
    function band() {
      const pic = document.getElementById("picture");
      const top = pic.offsetTop + pic.offsetHeight;
      const bottom = innerHeight - document.getElementById("probe").offsetHeight;
      const pad = Math.min(innerWidth, innerHeight) * 0.03;
      return { top: top + pad, bottom: bottom - pad };
    }
    function layout() {
      const b = band();
      // Width limit: the centered row of all-but-the-last letter plus the fully visible
      // peeking letter at the right edge must fit side by side (gaps are 0.1 × tile size).
      const n = tiles.length, margin = Math.min(innerWidth, innerHeight) * 0.03;
      const fitW = (innerWidth / 2 - margin) / ((n - 1 + 0.1 * Math.max(0, n - 2)) / 2 + 1.1);
      const T = Math.max(40, Math.min(innerHeight * 0.3, b.bottom - b.top, (innerWidth * 0.84) / (n + 0.7), fitW));
      const gap = T * 0.1;
      const rowW = placed * T + Math.max(0, placed - 1) * gap;
      const y = (b.top + b.bottom) / 2 - T / 2;
      tiles.forEach((t, i) => {
        t.el.style.width = t.el.style.height = T + "px";
        t.el.style.fontSize = T * 0.68 + "px";
        let x;
        if (i < placed) x = (innerWidth - rowW) / 2 + i * (T + gap);
        else if (i === placed && t.peeking) x = innerWidth - T - margin; // peeking in, fully visible at the right
        else x = innerWidth + T * 0.3;                                    // waiting offscreen
        t.el.style.transform = `translate(${x}px, ${y}px)`;
      });
    }
    addEventListener("resize", layout);

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function newWord() {
      speechRun++;
      Kit.stopVoice(); stopClip();
      tiles.forEach((t) => t.el.remove());
      document.getElementById("picture").classList.remove("show", "cheer");
      clearTimeout(nextTimer);

      if (!deck.length) deck = shuffle(WORDS.filter((w) => plain(w[0]) !== word));
      const [w, emoji] = deck.pop();
      word = plain(w); complete = false; placed = 0;
      recording(word); // start loading its recording now, so the first tap plays right away
      document.getElementById("picture").textContent = emoji;
      setTimeout(() => document.getElementById("picture").classList.add("show"), 150); // picture first, then the letters

      tiles = sounds(w).map((letters, i) => {           // one tile per sound: "ball" → B · A · LL
        const el = document.createElement("div");
        el.className = "tile " + (VOWELS.test(letters) ? "vowel" : "consonant");
        el.innerHTML = `<span>${letters.toUpperCase()}</span>`;
        document.body.appendChild(el);
        const t = { letters, index: i, spoken: SPOKEN[letters] || letters, el, peeking: false };
        el.addEventListener("pointerdown", (e) => { e.preventDefault(); tapped(i); });
        return t;
      });
      // Place the new tiles (offscreen to the right) instantly, without the slide animation;
      // otherwise they'd fly in from the top-left corner where new elements start out.
      tiles.forEach((t) => { t.el.style.transition = "none"; });
      layout();
      void document.body.offsetWidth; // apply those positions before turning animation back on
      tiles.forEach((t) => { t.el.style.transition = ""; });
      setTimeout(() => peek(0), 500);
    }

    function peek(i) {
      if (i >= tiles.length || placed !== i) return;
      const t = tiles[i];
      t.peeking = true;
      t.el.style.transition = "transform 1400ms ease-out"; // creep in slowly
      t.el.classList.add("peek");
      layout();
      setTimeout(() => { t.el.style.transition = ""; }, 1400);
    }

    function tapped(i) {
      if (i === placed && tiles[i].peeking) {
        // Pull the peeking letter into the word and say its sound.
        const t = tiles[i];
        t.peeking = false;
        t.el.classList.remove("peek");
        t.el.style.transition = "";
        placed++;
        layout();
        sayTiles([t]).then(() => { if (placed === tiles.length) finish(); });
        if (placed < tiles.length) setTimeout(() => peek(placed), 900);
        return;
      }
      if (i < placed) {
        // Tapping the letters in the middle: sound out what's there so far,
        // or say the whole word once it's done.
        if (complete) sayWord();
        else sayTiles(tiles.slice(0, placed));
      }
    }

    async function finish() {
      if (complete) return;
      complete = true;
      await new Promise((r) => setTimeout(r, 400));
      const ok = await sayTiles(tiles);
      const pic = document.getElementById("picture");
      pic.classList.remove("cheer"); void pic.offsetWidth; pic.classList.add("cheer");
      if (ok) await sayWord();
      [523, 659, 784].forEach((f, i) => Kit.tone(f, 0.2, { type: "triangle", volume: 0.15, delay: i * 0.1 }));
      const { confetti } = await Kit.use("confetti");
      confetti({ particleCount: 90, spread: 75, origin: { x: 0.5, y: 0.45 }, disableForReducedMotion: true });
      // After a pause to enjoy it (and tap the word to hear it again), on to a new word.
      nextTimer = setTimeout(newWord, 3500);
    }

    newWord();
  </script>
</body>
</html>
